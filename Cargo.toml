[package]
name = "spindle"
version = "0.1.0"
edition = "2021"
description = "A Rust terminal multiplexer for persistent parallel coding-agent sessions"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
ratatui = "0.29"
crossterm = "0.28"
vt100 = "0.15"
